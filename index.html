<html>
    <head>
    </head>

    <body style="background-color: #F5EBDD;">
        <center><h1><font color="#77718C"">Classic Literature Quiz</font></h1>
        <img src="Jane Austens Collection.png"
            alt="Jane Austen's books with flowers" width="350">
        <h2><font color="#96707E">Put your classic literature knowledge to the test!</font></h2></center>
        
        <div align="left">
        <table border="0" cellspacing="0" cellpadding="0" width="100%">
          <tr>
           <td width="50%"><form method="POST" name="instantquiz">
             <table border="0" width="100%" cellspacing="0" cellpadding="0">
              <caption><strong><font color= "#677665">To quiz or not to quiz, that is the question. ¯\(°_o)/¯</font></strong><br><br>
               </caption>
                
           
          <tr>
           <td width="100%"><div align="center"><center>
             <p>
                 <table bgcolor="#C688C9" cellpadding="5" cellspacing="0" border="0">
                     <tr>
                         <td>
                             <table bgcolor="#77718C" cellpadding="2" cellspacing="0" border="0">
                                 <tr>
                                     <td>
                                            <textarea rows="10" name="thequestion" cols="69" wrap="virtual" style="font-family: Georgia; font-size: 14px; color: #594D69;"></textarea>
                                     </td>
                                 </tr>
                             </table>
                         </td>
                     </tr>
                 </table>
              </p></center></div>
           </td>
          </tr>
               
         
        <!--YOUR ANSWER SECTION -->    
         <tr align="center">
          <td width="100%"><div align="center">
              <center>
                  <p>
                     <strong>
                          <font color="#96707E">Your Answer:</font>
                      </strong>
                        <select name="theresponse" size="1" onChange="responses()">
                            <option value="-----">----</option>
                            <option value="a">a</option>
                            <option value="b">b</option>
                            <option value="c">c</option>
                            <option value="d">d</option>
                      </select> 
                      </p>
                  </center>
               </div>
         </td>
    </tr>

             <!-- FEEDBACK SECTION -->
                 <tr align="center">
            <td width="50%"><div align="center">
                <center>
                    <p>
                        <br>
                          <strong>
                            <font color="#96707E">Feedback:</font>
                            </strong>
                            <input type="text" name="thesolution" size="35"> 
                    </p>
                </center>
            </div>
        </td>
    </tr>
    
            <!--NAVIGATION SECTION -->
            <tr align="center">
                <td width="100%">
                    <center>
                        
                           <input type="button" value="&lt;&lt;Back" name="B1"
                            onClick="if (whichone&gt;1){whichone--;generatequestions()}"> 
                    
                            <input type="button" value="Next&gt;&gt;" name="B2"
                            onClick="if (whichone&lt;=total){whichone++;generatequestions()}">
                         
                     </center>
                 </td>
             </tr>
                 
               <!-- START OVER & CHEAT MODE -->
                 <tr align= "center">
                     <td width="100%">
                         <center>
                             <p>
                              <small>
              <a href="#" onClick="whichone=1;generatequestions();return false">Start Over</a> 
                              </small>
            <input type="checkbox" name="cmode" value="ON">
            <small>Cheat Mode</small>
                             </p>
                         </center>
                     </td>
                 </tr>
                 

                 <!-- JAVASCRIPT KIT CREDIT -->
                 <tr align="center">
                     <td width="100%">
                        <p align="center"><font face="arial" size="-2">This free quiz script provided by</font><br> <font face="arial, helvetica" size="-2"><a href="http://javascriptkit.com">JavaScript Kit</a></font>
                            </p>
                     </td>
                </tr>
      </table>
    </form>
    </td>
  </tr>
</table>
</div>

<script src="pop.js">

<script language="JavaScript1.1">
var whichone=1
var tempmn=document.instantquiz.thequestion
function generatequestions(){
document.instantquiz.theresponse.selectedIndex=0
if (!document.instantquiz.cmode.checked||whichone>=total+1||whichone<=0)
document.instantquiz.thesolution.value=''
if (whichone>=total+1)
tempmn.value="End of quiz"
else{
tempmn.value=whichone+")  "+question[whichone]+"\n\n"+"a)  "+eval('choice'+whichone+'[1]')+"\n"+"b)  "+eval('choice'+whichone+'[2]')+"\n"+"c)  "+eval('choice'+whichone+'[3]')+"\n"+"d)  "+eval('choice'+whichone+'[4]')
if (document.instantquiz.cmode.checked)
document.instantquiz.thesolution.value=solution[whichone]
}
}

function responses(){
var temp2=document.instantquiz.theresponse
var temp3=temp2.options[temp2.selectedIndex].text
if (temp3!=solution[whichone]&&temp2.selectedIndex!=0)
document.instantquiz.thesolution.value="Sorry, the correct answer is "+solution[whichone]
else if(temp2.selectedIndex!=0)
document.instantquiz.thesolution.value=compliments[Math.round(Math.random()*compliments.length-1)]
}

generatequestions()
</script>

        
    <script src="script.js"></script>
</body>

</html>
